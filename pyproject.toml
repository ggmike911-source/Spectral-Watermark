[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectral-watermark"
version = "0.1.0"
description = "Crop-resilient, blind spectral image watermarking with RGB and RGBA support"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Mike Xian (@ggmike911-source)" }
]
keywords = [
    "image-watermarking",
    "digital-watermark",
    "spectral",
    "fourier-transform",
    "reed-solomon",
    "image-processing",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "pillow>=9.3.0",
    "reedsolo>=1.7.0",
    "click>=8.1.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "matplotlib>=3.6.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
    "ipykernel>=6.0.0"
]

[project.scripts]
spectral-watermark = "spectral_watermark.cli:main"

[project.urls]
Homepage = "https://github.com/ggmike911-source/Spectral-Watermark"
Repository = "https://github.com/ggmike911-source/Spectral-Watermark"
Issues = "https://github.com/ggmike911-source/Spectral-Watermark/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spectral_watermark = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"
